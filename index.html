<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideShare - Book Your Ride</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RideShare</h1>
    <p>Fast, convenient, and reliable transportation</p>
  </header>

  <main>
    <section class="booking-card">
      <h2>Book a Ride</h2>
      <form id="ride-form">
        <label for="pickup">Pickup Location:</label>
        <input type="text" id="pickup" placeholder="Enter pickup location" required>

        <label for="dropoff">Dropoff Location:</label>
        <input type="text" id="dropoff" placeholder="Enter destination" required>

        <button type="button" onclick="estimateFare()">Estimate Fare</button>
      </form>

      <div id="fare-result" class="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
